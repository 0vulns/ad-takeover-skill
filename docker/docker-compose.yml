name: adtk
services:
  kali:
    image: kalilinux/kali-rolling
    container_name: adtk-kali
    hostname: adtk-kali
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    volumes:
      - kali-home:/root
      - ../logs:/logs
      - ../scripts:/opt/adtk:ro
      - ../references:/opt/adtk/references:ro
      - ../conf:/opt/adtk/conf:ro
    networks:
      lab_lan:
        ipv4_address: ${IP_RANGE:-192.168.56}.200
    command: sleep infinity

networks:
  lab_lan:
    driver: macvlan
    driver_opts:
      parent: ${LAB_PARENT:-vboxnet0}
    ipam:
      config:
        - subnet: ${IP_RANGE:-192.168.56}.0/24
          gateway: ${IP_RANGE:-192.168.56}.1

volumes:
  kali-home:
