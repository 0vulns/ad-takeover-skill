# HTB / TryHackMe / any tun0 lab — share the host network, no macvlan.
name: adtk
services:
  kali:
    image: kalilinux/kali-rolling
    container_name: adtk-kali
    hostname: adtk-kali
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    volumes:
      - kali-home:/root
      - ../logs:/logs
      - ../scripts:/opt/adtk:ro
      - ../references:/opt/adtk/references:ro
      - ../conf:/opt/adtk/conf:ro
    command: sleep infinity

volumes:
  kali-home:
